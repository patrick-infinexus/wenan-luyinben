# Runs the Worker's AI features (summary, minutes, prompt, rewrite, picture) on a sample text
# through /api/probe and reports the results. Nothing is stored. Sets a one-off PROBE_KEY
# secret on the Worker and deletes it afterwards.
name: Check AI

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Probe
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API: https://wenan-luyinben.patrick-f78.workers.dev
        run: |
          export CLOUDFLARE_API_TOKEN=$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')
          export CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')
          KEY=$(openssl rand -hex 24)
          printf '%s' "$KEY" | npx --yes wrangler@4.147.0 secret put PROBE_KEY >/dev/null
          trap 'yes | npx --yes wrangler@4.147.0 secret delete PROBE_KEY >/dev/null 2>&1 || true' EXIT
          sleep 15
          KEY="$KEY" python3 - <<'EOF'
          import json, os, urllib.request, urllib.error
          MEMO = "今天开会讨论了新版官网上线的时间，大家同意下周三上线，小王负责测试，小李负责写上线公告，另外预算还需要再和财务确认一次。"
          IDEA = "我想让 AI 帮我把每周的工作周报写得更有条理，要突出成果和数据，语气专业但不要太官方，最后列出下周计划。"
          LINE = "世界上有三种人，一种正在发光，一种正在燃烧，一种正在腐烂。"
          runs = []
          tasks = [{"kind": "summary", "text": MEMO}, {"kind": "minutes", "text": MEMO}, {"kind": "prompt", "text": IDEA},
                   {"kind": "copy", "text": LINE}, {"kind": "image", "text": LINE},
                   {"kind": "handover", "text": "（鹏宇说，交给小李）官网下周三上线，测试交给小王，公告你来写，预算记得找财务确认，资料在共享盘的官网文件夹里。"}]
          req = urllib.request.Request(os.environ["API"] + "/api/probe", data=json.dumps({"runs": runs, "tasks": tasks}).encode(),
              headers={"Content-Type": "application/json", "X-Probe-Key": os.environ["KEY"], "User-Agent": "probe"})
          for attempt in range(4):
              try:
                  with urllib.request.urlopen(req, timeout=300) as r:
                      data = json.loads(r.read()); break
              except urllib.error.HTTPError as e:
                  data = {"error": e.code, "body": e.read()[:300].decode("utf-8", "replace")}
                  if e.code != 404: break
                  import time; time.sleep(10)
          for r in data.get("results", []):
              body = json.dumps(r.get("result") if r.get("ok") else r.get("error"), ensure_ascii=False)
              print(f"::notice title={r['model']} {'OK' if r.get('ok') else 'FAIL'} {r['ms']}ms::" + body.replace("\\n", " ⏎ ")[:1200])
          if "results" not in data:
              print("::error title=probe::" + json.dumps(data, ensure_ascii=False)[:500])
          EOF
